# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: CI quality check for the production translation model

# Keep in sync with the production TRANSLATE_MODEL (Vercel env) and the
# matching variant in promptfooconfig.yaml.
prompts:
  - '{{text}}'

providers:
  - id: file://translationProvider.ts
    label: gpt-6.1-terra reasoning=none fast
    config:
      model: gpt-6.1-terra
      reasoning: none
      serviceTier: fast

evaluateOptions:
  maxConcurrency: 16

defaultTest:
  vars:
    intent: sentence
    mode: casual
    uiLang: en
    context: ''
    refinements: ''
    previousMain: ''
    situation: ''
  options:
    provider:
      id: openai:responses:gpt-6.1-sol
      config:
        reasoning:
          effort: low
  assert:
    - type: javascript
      value: file://checks.ts
      metric: checks
    - type: llm-rubric
      value: file://rubrics.ts:translationRubric
      metric: translation
      threshold: 0.7
    - type: llm-rubric
      value: file://rubrics.ts:explanationsRubric
      metric: explanations
      threshold: 0.7

tests:
  - file://cases.yaml
  - file://injection.yaml
