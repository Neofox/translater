# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Translation and explanation quality across models and reasoning levels

# The providers build the production request from the test vars; this prompt
# only gives promptfoo a column label.
prompts:
  - '{{text}}'

# Each provider is one variant. Only model, reasoning effort and service tier
# (Fast costs 2x Standard) differ; prompts, schema and OpenAI options come from
# src/server/translationRequest.ts. Calls go directly to OpenAI.
providers:
  # Production before the OpenAI switch (via Gateway, Standard tier).
  - id: file://translationProvider.ts
    label: gpt-6-luna reasoning=none
    config:
      model: gpt-6-luna
      reasoning: none
      serviceTier: default
  - id: file://translationProvider.ts
    label: gpt-6-luna reasoning=none fast
    config:
      model: gpt-6-luna
      reasoning: none
      serviceTier: fast
  - id: file://translationProvider.ts
    label: gpt-6-luna reasoning=low fast
    config:
      model: gpt-6-luna
      reasoning: low
      serviceTier: fast
  # Production since 2026-10-30.
  - id: file://translationProvider.ts
    label: gpt-6.1-terra reasoning=none fast
    config:
      model: gpt-6.1-terra
      reasoning: none
      serviceTier: fast
  - id: file://translationProvider.ts
    label: gpt-6.1-terra reasoning=low fast
    config:
      model: gpt-6.1-terra
      reasoning: low
      serviceTier: fast
  # Quality yardstick; its lowest effort is low (no none).
  - id: file://translationProvider.ts
    label: gpt-6.1-sol reasoning=low fast
    config:
      model: gpt-6.1-sol
      reasoning: low
      serviceTier: fast
  - id: file://translationProvider.ts
    label: gpt-6.1-sol reasoning=low
    config:
      model: gpt-6.1-sol
      reasoning: low
      serviceTier: default

evaluateOptions:
  # promptfoo backs off on rate limits.
  maxConcurrency: 16

defaultTest:
  vars:
    intent: sentence
    mode: casual
    uiLang: en
    context: ''
    refinements: ''
    previousMain: ''
    situation: ''
  options:
    # Judges grade one anonymous output at a time. No select-best: promptfoo
    # shows variants in config order and the judge favoured the first one, so
    # `npm run eval:summary` ranks variants from these scores instead.
    # Judged by OpenAI's strongest model (paid from the OpenAI credit). It is
    # the same family as the candidates and also the sol variant itself, so
    # read a small sol lead with care; scores before 2026-10-30 came from
    # Claude Sonnet and are not directly comparable.
    provider:
      id: openai:responses:gpt-6.1-sol
      config:
        reasoning:
          effort: low
  assert:
    - type: javascript
      value: file://checks.ts
      metric: checks
    - type: llm-rubric
      value: file://rubrics.ts:translationRubric
      metric: translation
      threshold: 0.7
    - type: llm-rubric
      value: file://rubrics.ts:explanationsRubric
      metric: explanations
      threshold: 0.7

tests:
  - file://cases.yaml
  - file://injection.yaml
