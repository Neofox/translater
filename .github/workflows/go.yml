name: Go app

# No secrets and no billed requests: e2e runs against the fake OpenAI upstream
# (go/cmd/fakeopenai) with OPENAI_API_KEY=test.
#
# Toolchain: jdx/mise-action reads go/mise.toml, which pins both Go and
# tailwindcss (used by `make css`); actions/setup-go would not provide the
# latter. The templ generator comes from the go.mod tool directive.
on:
  pull_request:
    paths:
      - go/**
      - e2e/**
      - shared/**
      - src/components/**
      - package.json
      - package-lock.json
      - src/server/**
      - src/lib/**
      - .github/workflows/go.yml
  workflow_dispatch:

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/go

jobs:
  unit:
    name: Unit, generated files, shared contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          working_directory: go
          cache: true

      # mise-action's cache covers only mise tools, not Go modules/build cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # Before the Go steps: go generate (syncicons) and TestIconsFresh read
      # node_modules/lucide-static.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Go tests
        working-directory: go
        run: go test ./...

      # Regenerates the shared contract copy, icons, templ output and
      # CSS, then fails when any committed copy differs.
      - name: Generated files are fresh
        working-directory: go
        run: make check

      # A directory argument fails on newer Node; use the glob form.
      - name: JS unit tests
        working-directory: go
        run: node --test 'web/static/js/*.test.js'

      - name: JS size budget
        working-directory: go
        run: make size

  # Every e2e tag, all 18 projects (9 viewports × Chromium and WebKit),
  # against the fake upstream. analytics/early-typing ride on @core and
  # speechEndpoint on @speech; a test carrying two tags runs in both jobs.
  # @visual runs in the visual job, @prod (billed) never runs here, and
  # @review needs KEYBOARD_REVIEW, so it skips.
  # macOS: geometry and tap-position tests depend on the system fonts
  # (Korean glyph widths) and on the WebKit build; Linux shifts layouts by a
  # few pixels.
  e2e:
    name: E2E @${{ matrix.tag }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tag: [core, context, layout, learning, word, refine, speech]
    env:
      OPENAI_API_KEY: test
      E2E_WORKERS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          working_directory: go
          cache: true

      # mise-action's cache covers only mise tools, not Go modules/build cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium webkit

      # mise-action puts go on PATH; Playwright spawns `go run` from go/.
      - name: E2E @${{ matrix.tag }}
        run: npx playwright test -c e2e --grep @${{ matrix.tag }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.tag }}
          path: |
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # On demand only (Actions → Go app → Run workflow): the full visual run
  # (28 states, 18 projects, TS baselines then Go compared) is long.
  visual:
    name: TS-vs-Go visual parity
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: test
      E2E_WORKERS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          working_directory: go
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium webkit

      # Baselines come from the TS production build in this same run, so the
      # runner's fonts and rendering are identical for both apps.
      - name: Visual parity (TS baseline, Go compared)
        run: npm run e2e:visual

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-visual
          path: |
            test-results
          if-no-files-found: ignore
          retention-days: 7
