name: Translation quality eval

# Billed: about $1 per run (production model only). Runs when the model-facing
# request or the eval changes, or on demand from the Actions tab. The request
# body comes from the Go app (cmd/request), which the eval provider builds.
on:
  pull_request:
    paths:
      - internal/prompt/**
      - cmd/request/**
      - shared/translation/**
      - evals/**
      - .github/workflows/translation-eval.yml
  workflow_dispatch:

concurrency:
  group: translation-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  eval:
    # Fork PRs do not receive the OpenAI secret.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Go builds cmd/request (the production request body); mise reads
      # the toolchain pinned in mise.toml.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Translation and judge responses are cached by request, so unchanged
      # cases cost nothing on reruns.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .promptfoo-cache
          key: promptfoo-${{ hashFiles('internal/prompt/**', 'shared/translation/**', 'evals/**') }}
          restore-keys: promptfoo-

      - uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # promptfoo-action-v1.3.4
        env:
          # Translations and the judge both call OpenAI.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: evals/ci.promptfooconfig.yaml
          promptfoo-version: 0.125.1
          use-config-prompts: true
          force-run: true
          no-share: true
          cache-path: .promptfoo-cache
          max-concurrency: '16'
          # Gate on the suite pass rate, not on every case: a judge always
          # fails a few cases (sol-low itself passes ~80%). Production terra
          # passes 66-76%; the previous luna setup 34-42%.
          fail-on-threshold: '60'
          no-progress-bar: true
